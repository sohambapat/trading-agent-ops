[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent-ops"
version = "0.1.0"
description = "Production ops infrastructure for autonomous LLM trading agents on edge hardware"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Soham Bapat" }]
requires-python = ">=3.12"
# the safety layer is deliberately dependency-free; adapters ported later
# (broker, notifier, backup) will carry their own optional extras
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["tradeops*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selected explicitly rather than inherited. CI installs the current ruff, and
# a release that widens the default rule set otherwise turns a green pipeline
# red on a commit that changed nothing — the lint config has to be as pinned as
# the dependency it lints with.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
